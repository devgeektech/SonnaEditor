<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saha</title>
  <script>
    try {
      if (localStorage.getItem('saha-theme') === 'light') {
        localStorage.removeItem('saha-theme');
      }
      document.documentElement.dataset.theme = 'dark';
    } catch (e) {}
  </script>
  <style>
    :root,
    html[data-theme="dark"] {
      --saha-bg-deep: #16140F;
      --saha-bg-panel: #1F1D17;
      --saha-bg-lifted: #2A2822;
      --saha-bg-hover: #34322B;
      --saha-line: #2C2A24;
      --saha-line-soft: #24221C;
      --saha-fg: #E8E6E0;
      --saha-fg-mute: #B2ADA1;
      --saha-fg-dim: #807A6D;
      --saha-fg-faint: #5C574D;
      --saha-accent: #E05353;
      --saha-accent-soft: #C84343;
      --saha-accent-tint: rgba(224, 83, 83, 0.18);
      --saha-on-accent: #FFFFFF;
      --saha-green: #6E9B7E;
      --saha-amber: #C49A5E;
      --saha-red: #E05353;
      --saha-on-danger: #FFFFFF;
    }
    html[data-theme="light"] {
      --saha-bg-deep: #F7F3ED;
      --saha-bg-panel: #FFFDF9;
      --saha-bg-lifted: #EFE7DC;
      --saha-bg-hover: #E7DCCF;
      --saha-line: #D8CEC1;
      --saha-line-soft: #E7DED3;
      --saha-fg: #221B15;
      --saha-fg-mute: #5F564E;
      --saha-fg-dim: #7A7067;
      --saha-fg-faint: #A3988D;
      --saha-accent: #E05353;
      --saha-accent-soft: #C84343;
      --saha-accent-tint: rgba(224, 83, 83, 0.16);
      --saha-on-accent: #FFFFFF;
      --saha-green: #4F8464;
      --saha-amber: #A9792C;
      --saha-red: #E05353;
      --saha-on-danger: #FFFFFF;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--saha-bg-deep);
      color: var(--saha-fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      overflow: hidden;
      height: 100%;
    }
    #root { height: 100%; }
    * { box-sizing: border-box; }
    @keyframes saha-spin { to { transform: rotate(360deg); } }
    @keyframes saha-processing-pulse {
      0%, 100% { box-shadow: 0 0 0 rgba(225, 122, 54, 0); }
      50% { box-shadow: 0 0 18px rgba(225, 122, 54, 0.28); }
    }
    .saha-table-scroll {
      width: 100%;
      overflow: visible;
    }
    @media (max-width: 960px) {
      .saha-table-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 56px;
        margin-bottom: -56px;
      }
    }
    .saha-lite-setup-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 20px;
      align-items: stretch;
    }
    .saha-ai-tools-grid {
      display: grid;
      grid-template-columns: 195px 1.25fr 1fr;
      gap: 22px;
      align-items: start;
    }
    .saha-2col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .saha-3col-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .saha-login-form {
      width: 100%;
      height: 100%;
      display: flex;
      overflow: auto;
      margin: 0;
    }
    .saha-login-brand {
      width: 44%;
      max-width: 560px;
      min-width: 320px;
      flex-shrink: 0;
    }
    @media (max-width: 820px) {
      .saha-ai-tools-grid {
        grid-template-columns: 1fr !important;
      }
      .saha-login-form {
        flex-direction: column;
      }
      .saha-login-brand {
        width: 100% !important;
        max-width: none !important;
        min-width: 0 !important;
        padding: 28px 24px !important;
      }
    }
    @media (max-width: 760px) {
      .saha-lite-setup-grid {
        grid-template-columns: 1fr !important;
      }
    }
    @media (max-width: 680px) {
      .saha-2col-grid {
        grid-template-columns: 1fr !important;
      }
      .saha-3col-grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.jsx"></script>
</body>
</html>
