[project]
name = "sonna-editor"
version = "0.1.0"
description = "Internal AI photo editing tool for Sonna Studios"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "pytorch-lightning==2.6.1",
    "rawpy==0.27.0",
    "pillow==12.2.0",
    "lxml==6.1.0",
    "pandas==3.0.2",
    "pyarrow==24.0.0",
    "numpy==2.4.4",
    "matplotlib==3.10.9",
    "tqdm==4.67.3",
    "pyqt6==6.11.0",
    "scikit-learn==1.8.0",
    "tensorboard==2.20.0",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.12",
    "mypy==2.0.0",
    "httpx==0.28.1",
    "uv==0.11.17",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonna_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live tests that require real hardware/files (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
