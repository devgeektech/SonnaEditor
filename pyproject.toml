[project]
name = "sonna-editor"
version = "0.1.0"
description = "Internal AI photo editing tool for Sonna Studios"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "pytorch-lightning",
    "rawpy",
    "pillow",
    "lxml",
    "pandas",
    "pyarrow",
    "numpy",
    "tqdm",
    "pyqt6",
    "scikit-learn",
    "tensorboard>=2.20.0",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonna_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: live tests that require real hardware/files (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
